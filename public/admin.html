<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendedores</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;display:flex;height:100vh;color:#111}
  aside{width:320px;overflow:auto;border-right:1px solid #ddd;padding:12px;background:#fafafa}
  #map{flex:1}
  .row{padding:10px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;background:#fff;cursor:pointer}
  .row b{display:block}
  .row small{color:#666}
  .stale{color:#dc2626}.live{color:#16a34a}
  .acts{margin-top:6px;display:flex;gap:6px}
  button,input{font:inherit;padding:6px 10px;border:1px solid #ccc;border-radius:6px;background:#fff}
  .add{display:flex;gap:6px;margin-bottom:12px}.add input{flex:1;min-width:0}
  @media(max-width:700px){body{flex-direction:column-reverse}aside{width:100%;height:45vh;border:0}#map{height:55vh;flex:none}}
</style>
</head>
<body>
<aside>
  <div class="add"><input id="name" placeholder="Nombre del vendedor"><button id="add">Agregar</button></div>
  <details style="margin-bottom:12px"><summary>Configurar Traccar Client</summary>
    <small>En la app del vendedor: <b>URL del servidor</b> = <code id="srv"></code>, <b>ID del dispositivo</b> = el ID de abajo, frecuencia 30 s, y permitir ubicación "Siempre".</small></details>
  <div id="list"></div>
</aside>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
let key = localStorage.getItem('adminKey') || '';
const $ = id => document.getElementById(id);
const map = L.map('map').setView([-34.6, -58.4], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
const markers = {}, trails = {};
let fitted = false;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': key } });
  if (r.status === 401) {
    key = prompt('Clave de administrador') || '';
    localStorage.setItem('adminKey', key);
    return api(path, opts);
  }
  return r.json();
}

const ago = ts => {
  const s = Math.round((Date.now() - ts) / 1000);
  return s < 60 ? `hace ${s}s` : s < 3600 ? `hace ${Math.round(s / 60)} min` : `hace ${Math.round(s / 3600)} h`;
};
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function refresh() {
  const sellers = await api('/api/sellers');
  const bounds = [];
  $('list').innerHTML = '';
  for (const s of sellers) {
    const live = s.last && Date.now() - s.last.ts < 90000;
    if (s.last) {
      const ll = [s.last.lat, s.last.lng];
      bounds.push(ll);
      if (!markers[s.token]) markers[s.token] = L.marker(ll).addTo(map);
      markers[s.token].setLatLng(ll).bindTooltip(s.name, { permanent: true, direction: 'top' });
      if (!trails[s.token]) trails[s.token] = L.polyline([], { weight: 3, opacity: .6 }).addTo(map);
      trails[s.token].setLatLngs(s.trail.map(t => [t[0], t[1]]));
    }
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `<b>${esc(s.name)}</b><small class="${live ? 'live' : 'stale'}">${
      s.last ? (live ? '● en línea · ' : '○ ') + ago(s.last.ts) : 'sin ubicación aún'}</small>
      <div class="acts"><button data-a="id">Copiar ID</button><button data-a="copy">Copiar link</button><button data-a="del">Borrar</button></div>`;
    div.onclick = e => {
      const a = e.target.dataset.a;
      if (a === 'id') {
        navigator.clipboard.writeText(s.token).then(() => e.target.textContent = '¡Copiado!', () => prompt('ID:', s.token));
      } else if (a === 'copy') {
        const link = `${location.origin}/s/${s.token}`;
        navigator.clipboard.writeText(link).then(() => e.target.textContent = '¡Copiado!', () => prompt('Link:', link));
      } else if (a === 'del') {
        if (confirm(`¿Borrar a ${s.name}?`)) {
          api('/api/sellers/' + s.token, { method: 'DELETE' }).then(() => {
            markers[s.token]?.remove(); trails[s.token]?.remove();
            delete markers[s.token]; delete trails[s.token]; refresh();
          });
        }
      } else if (s.last) map.setView([s.last.lat, s.last.lng], 16);
    };
    $('list').appendChild(div);
  }
  if (!fitted && bounds.length) { map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 }); fitted = true; }
}

$('add').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) return;
  await api('/api/sellers', { method: 'POST', body: JSON.stringify({ name }) });
  $('name').value = '';
  refresh();
};
$('srv').textContent = location.origin;
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
